<!DOCTYPE html>
<html lang="{{ .Language.LanguageCode }}" dir="{{ .Language.LanguageDirection | default "ltr" }}">
<head>
  {{ hugo.Generator }}
  {{ partial "docs/html-head" . }}
  {{ partial "extend-head.html" . }}
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/fonts.css">
</head>
<body>
  <header class="site-nav">
    <nav>
      <a href="/" class="brand">
        <span class="brand-mark">AEO</span>
        <span class="brand-copy"><span>Agent Engine</span><span>Optimization</span></span>
      </a>
      <div class="links">
        <a href="/docs/what-is-aeo/">Framework</a>
        <a href="/docs/execution-layer/">Protocols</a>
        <a href="/docs/implement-aeo/">Guides</a>
        <a href="/docs/audit/">Resources</a>
        <a href="/docs/future-of-aeo/">Research</a>
        <a href="/tools/aeo-readiness-checker.html" class="checker">Checker</a>
        <a href="/docs/audit/" class="cta">Audit</a>
        <button class="theme-toggle" type="button" title="Toggle color theme" aria-label="Toggle color theme">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </nav>
  </header>
  <main>
    <div class="content-wrap">
      {{ block "main" . }}{{ end }}
    </div>
  </main>
  <footer class="site-footer">
    <div class="site-footer-inner">
      <p>&copy; 2026 Agent Engine Optimization</p>
      <nav>
        <a href="/docs/about/">About</a>
        <a href="/tools/aeo-readiness-checker.html">Checker</a>
        <a href="/docs/audit/">Audit</a>
        <a href="/docs/privacy/">Privacy</a>
        <a href="/docs/disclaimer/">Disclaimer</a>
        <a href="/sitemap.xml">Sitemap</a>
      </nav>
    </div>
  </footer>
  <script>
  (function(){
    document.addEventListener('click',function(e){var b=e.target.closest('.theme-toggle');if(!b)return;e.preventDefault();var c=document.documentElement.getAttribute('data-theme'),d=c==='dark'||(!c&&window.matchMedia('(prefers-color-scheme: dark)').matches),n=d?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('theme',n)}catch(x){}});
    document.querySelectorAll('.markdown pre, .book-article pre').forEach(function(pre){
      if(pre.parentNode.classList.contains('code-block-wrapper'))return;
      var w=document.createElement('div');w.className='code-block-wrapper';
      pre.parentNode.insertBefore(w,pre);w.appendChild(pre);
      var b=document.createElement('button');b.className='copy-code-btn';b.type='button';b.textContent='Copy';
      b.setAttribute('aria-label','Copy code to clipboard');
      b.addEventListener('click',function(){
        var code=pre.querySelector('code');var txt=code?code.innerText:pre.innerText;
        navigator.clipboard.writeText(txt).then(function(){
          b.textContent='Copied!';b.classList.add('copied');
          setTimeout(function(){b.textContent='Copy';b.classList.remove('copied');},2000);
        });
      });
      w.appendChild(b);
    });
  })();
  </script>
</body>
</html>
