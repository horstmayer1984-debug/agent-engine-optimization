<!-- Robots -->
<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large">

<!-- Favicon -->
<link rel="apple-touch-icon" href="/images/og-default.svg">
<link rel="icon" type="image/svg+xml" href="/images/og-default.svg">

<!-- Schema: @graph for homepage -->
{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://agent-engine-optimization.com/#organization",
      "name": "Agent Engine Optimization",
      "url": "https://agent-engine-optimization.com/",
      "description": "Research hub and strategy consultancy for optimizing digital presence for autonomous AI agents.",
      "foundingDate": "2026"
    },
    {
      "@type": "WebSite",
      "@id": "https://agent-engine-optimization.com/#website",
      "url": {{ "/" | absLangURL }},
      "name": "Agent Engine Optimization",
      "description": "Research hub and strategy consultancy for optimizing digital presence for autonomous AI agents. Framework, audits, and guides for the execution layer.",
      "inLanguage": {{ or .Language.LanguageCode .Language.Lang }},
      "publisher": {
        "@id": "https://agent-engine-optimization.com/#organization"
      }
    },
    {
      "@type": "WebPage",
      "@id": "{{ .Permalink }}#webpage",
      "url": {{ .Permalink }},
      "name": {{ .Title }},
      "description": {{ or .Description .Site.Params.description }},
      "inLanguage": {{ or .Language.LanguageCode .Language.Lang }},
      "isPartOf": {
        "@id": "https://agent-engine-optimization.com/#website"
      }
    }
  ]
}
</script>
{{ end }}

<!-- Schema: Article + BreadcrumbList for doc pages -->
{{ if and (eq .Section "docs") (not .IsSection) }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Article",
      "headline": {{ .Title }},
      "description": {{ or .Description .Params.summary "" }},
      "inLanguage": {{ or .Language.LanguageCode .Language.Lang }},
      "datePublished": {{ .Date.Format "2006-01-02" }},
      "dateModified": {{ .Lastmod.Format "2006-01-02" }},
      "author": {
        "@type": "Organization",
        "name": "Agent Engine Optimization",
        "url": "https://agent-engine-optimization.com/"
      },
      "publisher": {
        "@id": "https://agent-engine-optimization.com/#organization"
      },
      "mainEntityOfPage": {{ .Permalink }}
    },
    {
      "@type": "Organization",
      "@id": "https://agent-engine-optimization.com/#organization",
      "name": "Agent Engine Optimization",
      "url": "https://agent-engine-optimization.com/",
      "description": "Research hub and strategy consultancy for optimizing digital presence for autonomous AI agents."
    },
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": {{ if eq .Language.Lang "de" }}"Startseite"{{ else if eq .Language.Lang "ja" }}"ホーム"{{ else if eq .Language.Lang "es" }}"Inicio"{{ else if eq .Language.Lang "pt" }}"Início"{{ else }}"Home"{{ end }},
          "item": {{ "/" | absLangURL }}
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": {{ .Title }},
          "item": {{ .Permalink }}
        }
      ]
    }
  ]
}
</script>
{{ end }}

<!-- Schema: CollectionPage for section / list pages -->
{{ if and (eq .Section "docs") .IsSection }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "CollectionPage",
      "@id": "{{ .Permalink }}#webpage",
      "url": {{ .Permalink }},
      "name": {{ .Title }},
      "description": {{ or .Description .Site.Params.description }},
      "inLanguage": {{ or .Language.LanguageCode .Language.Lang }},
      "publisher": {
        "@id": "https://agent-engine-optimization.com/#organization"
      }
    },
    {
      "@type": "Organization",
      "@id": "https://agent-engine-optimization.com/#organization",
      "name": "Agent Engine Optimization",
      "url": "https://agent-engine-optimization.com/",
      "description": "Research hub and strategy consultancy for optimizing digital presence for autonomous AI agents."
    }
  ]
}
</script>
{{ end }}
